name: Deploy site

on:
  schedule:
    # 运行器是 UTC。这三个钟点对应北京时间 08:30、14:30、20:30。
    # 简报按北京时间的自然日归档，不使用运行器的本地时区。
    - cron: "30 0,6,12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 只抓原始候选，写到 site/data/raw/candidates.json，供助手挑选。
      # 页面展示的精选内容在 site/data/briefs.json，由助手直接提交，这里绝不改写它。
      - name: Collect raw candidates
        continue-on-error: true
        env:
          TZ: Asia/Shanghai
        run: python scripts/fetch_news.py --raw-only --output site/data/raw/candidates.json

      - name: Save raw candidates
        if: github.event_name != 'push'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/raw/candidates.json
          if git diff --cached --quiet; then
            echo "原始候选没有变化，跳过提交"
          else
            git commit -m "更新原始候选（不影响精选简报）"
            git pull --rebase --autostash || true
            git push
          fi

      # enablement 需要 GITHUB_TOKEN 以外的令牌（PAT 的 repo / Pages 写权限，
      # 或 GitHub App 的 administration:write + pages:write）。默认令牌做不到，
      # 所以这一步允许失败，接着用普通 configure-pages。
      - name: Try to enable GitHub Pages
        id: enable_pages
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Configure GitHub Pages
        id: configure_pages
        if: steps.enable_pages.outcome != 'success'
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Pages setup hint
        if: steps.enable_pages.outcome != 'success' && steps.configure_pages.outcome != 'success'
        run: |
          echo "::warning::未能用工作流令牌开启 GitHub Pages。请仓库所有者打开 Settings → Pages → Build and deployment，把 Source 选成 GitHub Actions 并保存，然后重新运行 Deploy site。"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
